<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
                
    </head>
    <body>
        <div class="container">
            <div class="side-container">
                <h3>HOME</h3>
                <div class="black-square">
                    <p id="home-score"></p>
                </div>
                <div class="btns-container" >
                    <button class="btns" onclick="home1()">+1</button>
                    <button class="btns" onclick="home2()">+2</button>
                    <button class="btns" onclick="home3()">+3</button>
                </div>
            </div>
            <div class="side-container">
                <h3>Guest</h3>
                <div class="black-square">
                <p id="guest-score"></p>
                </div>
                <div class="btns-container">
                    <button class="btns" onclick="guest1()">+1</button>
                    <button class="btns" onclick="guest2()">+2</button>
                    <button class="btns" onclick="guest3()">+3</button>
                </div>
            </div>
             <button id="new-game" onclick="newGame()">New Game</button>
        </div>
       
        <script src="index.js"></script>
    </body>
</html>
